<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0084ff" />
  <title>MyChat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ekran logowania -->
  <section id="login-screen" class="login">
    <form id="login-form" class="login__card" autocomplete="off">
      <div class="login__logo">💬</div>
      <h1>MyChat</h1>
      <p>Wpisz swój nick, aby dołączyć do rozmowy.</p>
      <input
        id="nick-input"
        type="text"
        placeholder="Twój nick"
        maxlength="20"
        required
        autofocus
      />
      <p id="login-error" class="login__error" role="alert"></p>
      <button type="submit">Dołącz do czatu</button>
    </form>
  </section>

  <!-- Okno czatu -->
  <main id="chat-screen" class="chat hidden">
    <header class="chat__header">
      <div class="chat__title">
        <h2>Czat ogólny</h2>
        <span id="status" class="chat__status">łączenie…</span>
      </div>
      <span id="online-count" class="chat__online">0 online</span>
    </header>

    <div id="messages" class="messages" aria-live="polite"></div>
    <div id="typing" class="typing"></div>

    <form id="message-form" class="composer" autocomplete="off">
      <input
        id="message-input"
        type="text"
        placeholder="Napisz wiadomość…"
        maxlength="500"
      />
      <button type="submit" aria-label="Wyślij">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
          <path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z" />
        </svg>
      </button>
    </form>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
